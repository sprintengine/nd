packages:
  - apps/*
  - packages/*

# Every external dependency version lives here, so all workspaces use the same one.
catalogMode: strict
catalog:
  "@commitlint/cli": 21.2.4
  "@commitlint/config-conventional": 21.2.4
  "@eslint/js": 10.0.1
  "@fastify/cors": 11.4.3
  "@fastify/helmet": 13.2.0
  "@fastify/rate-limit": 11.3.0
  "@fastify/swagger": 9.9.5
  "@types/node": 26.6.10
  "@types/pg": 8.23.1
  "@types/ws": 8.18.2
  "@vitest/coverage-v8": 5.1.2
  better-auth: 1.7.28
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  eslint: 10.15.0
  eslint-config-prettier: 10.1.8
  eslint-plugin-simple-import-sort: 14.0.0
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  globals: 17.14.0
  knip: 6.48.0
  lefthook: 2.2.3
  openapi-types: 12.1.3
  pg: 8.23.1
  pg-boss: 12.40.0
  pino: 10.4.0
  prettier: 3.10.1
  stripe: 23.2.0
  syncpack: 15.3.4
  turbo: 2.11.13
  typescript: 7.0.2
  typescript-eslint: 8.74.0
  vitest: 5.1.2
  ws: 8.23.0
  zod: 4.6.7

catalogs:
  # typescript-eslint needs the TypeScript compiler API, which TypeScript 7 does
  # not ship yet. @nd/config (the only package that loads typescript-eslint)
  # gets TypeScript 6's API under the name "typescript"; `tsc` everywhere else
  # is TypeScript 7. Drop this once typescript-eslint supports TypeScript 7.
  lint:
    typescript: npm:@typescript/typescript6@6.0.2

engineStrict: true

# Dependencies allowed to run install scripts. lefthook's installs the git
# hooks; it skips CI and directories that are not git repositories.
onlyBuiltDependencies:
  - lefthook

# drizzle-kit (development only) still pulls in a deprecated loader that pins
# esbuild 0.18, which has a moderate advisory (GHSA-67mh-4wv8-2f99). Force a
# patched esbuild there; drizzle-kit's own commands are unaffected.
overrides:
  "@esbuild-kit/core-utils>esbuild": 0.25.12
