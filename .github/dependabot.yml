version: 2

updates:
  # pnpm workspace: versions live in the catalog in pnpm-workspace.yaml.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 10
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-development:
        dependency-type: development
        update-types: [minor, patch]
      npm-production:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directories:
      - /
      - /.github/actions/*
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns: ["*"]

  # Images in docker-compose.dev.yml and infra/compose*.yml. Kept in step by
  # hand: the CI service image in .github/workflows/ci.yml, the tool images in
  # .github/workflows/docker.yml and the aws-cli image in infra/backup-lib.sh.
  - package-ecosystem: docker-compose
    directories:
      - /
      - /infra
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker-compose:
        patterns: ["*"]

  # Base images in the deployable apps' Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /apps/api
      - /apps/ocpp-gateway
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    commit-message:
      prefix: chore
      include: scope
    groups:
      docker:
        patterns: ["*"]
