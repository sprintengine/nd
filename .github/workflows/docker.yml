name: Docker

on:
  pull_request:
  merge_group:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read # check out the code

env:
  # Tools run from images pinned by digest. Bump the tag and digest together.
  HADOLINT_IMAGE: hadolint/hadolint:v2.15.1@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d
  TRIVY_IMAGE: aquasec/trivy:0.76.2@sha256:8f6bb947dbc528902e11f2f5be52f7b519f6a39d5d148f41166f2040499768fb
  CADDY_IMAGE: caddy:2.11.9-alpine@sha256:003a97808e781aa9f7e75cc2f43d34d461099031faf5e20faefb9f61126836f0

jobs:
  hadolint:
    name: Hadolint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint the Dockerfiles
        run: |
          status=0
          for dockerfile in apps/*/Dockerfile tests/e2e/stripe-double/Dockerfile; do
            echo "::group::$dockerfile"
            docker run --rm -i "$HADOLINT_IMAGE" hadolint - < "$dockerfile" || status=1
            echo "::endgroup::"
          done
          exit "$status"

  infra-config:
    name: Compose, Caddy and scripts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate every compose file
        run: |
          # infra/.env.example leaves the secrets empty; give them placeholders.
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' infra/.env.example > "$RUNNER_TEMP/ci.env"
          docker compose --file infra/compose.yml --env-file "$RUNNER_TEMP/ci.env" config --quiet
          docker compose --file infra/compose.e2e.yml config --quiet
          docker compose --file docker-compose.dev.yml config --quiet
      - name: Validate and format-check the Caddyfile
        run: |
          # A throwaway self-signed pair stands in for the Origin CA certificate.
          mkdir -p "$RUNNER_TEMP/certs"
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 -subj "/CN=example.com" \
            -keyout "$RUNNER_TEMP/certs/origin-key.pem" -out "$RUNNER_TEMP/certs/origin.pem" 2> /dev/null
          chmod 644 "$RUNNER_TEMP/certs/"*.pem
          docker run --rm \
            -e DOMAIN=example.com -e ACME_EMAIL=dev@example.com \
            -v "$PWD/infra/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$RUNNER_TEMP/certs:/etc/caddy/certs:ro" \
            "$CADDY_IMAGE" sh -c 'caddy validate --config /etc/caddy/Caddyfile && caddy fmt --diff /etc/caddy/Caddyfile'
      - name: Shellcheck the infra scripts
        run: shellcheck --external-sources infra/*.sh

  build:
    name: Build and scan (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        app: [api, ocpp-gateway]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build the image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: false
          load: true
          tags: nd-${{ matrix.app }}:e2e
          cache-from: type=gha,scope=nd-${{ matrix.app }}
          cache-to: type=gha,mode=max,scope=nd-${{ matrix.app }}
      - name: Scan for HIGH and CRITICAL vulnerabilities with a fix
        env:
          IMAGE: nd-${{ matrix.app }}:e2e
        run: |
          docker run --rm \
            -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image \
            --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress "$IMAGE"

  e2e:
    name: End-to-end tests
    needs: [build]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # Rebuilt from the build job's layer cache, so these are quick.
      - name: Load the api image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          load: true
          tags: nd-api:e2e
          cache-from: type=gha,scope=nd-api
      - name: Load the ocpp-gateway image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/ocpp-gateway/Dockerfile
          push: false
          load: true
          tags: nd-ocpp-gateway:e2e
          cache-from: type=gha,scope=nd-ocpp-gateway
      - name: Run the smoke test
        env:
          E2E_NO_BUILD: "1"
          # The gateway checks Basic Auth, so an upgrade without credentials is a 401.
          E2E_EXPECT_WS_STATUS: "401"
        run: infra/e2e-smoke.sh
      - uses: ./.github/actions/setup
      # The scenarios in tests/e2e, against the same images. The suite starts
      # the stack and leaves its logs in tests/e2e/stack.log.
      - name: Run the end-to-end suite
        env:
          E2E_NO_BUILD: "1"
        run: pnpm test:e2e
      - name: Upload the stack's logs
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-stack-logs
          path: tests/e2e/stack.log
          if-no-files-found: ignore
          retention-days: 7

  # One stable check to require in branch protection, as in ci.yml.
  docker-result:
    name: Docker result
    if: ${{ always() }}
    needs: [hadolint, infra-config, build, e2e]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check job results
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
